<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audio & Soundfont Test</title>
    <script src="https://cdn.jsdelivr.net/npm/tone@14.8.49/build/Tone.min.js"></script>
    <script defer src="https://cdn.vercel.app/_vercel/insights/script.js"></script>
    <script src="/music_player/soundfonts/acoustic_grand_piano-ogg.js"></script>
    <script src="/music_player/soundfonts/choir_aahs-ogg.js"></script>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            max-width: 900px;
            margin: 50px auto;
            padding: 20px;
            background: #f5f5f5;
        }
        .status {
            padding: 20px;
            margin: 20px 0;
            border-radius: 8px;
            font-size: 16px;
        }
        .loading { background: #fff3cd; border: 2px solid #ffc107; }
        .success { background: #d4edda; border: 2px solid #28a745; }
        .error { background: #f8d7da; border: 2px solid #dc3545; }
        .warning { background: #fff3cd; border: 2px solid #ffc107; }
        .info { background: #d1ecf1; border: 2px solid #17a2b8; margin-top: 20px; font-size: 14px; }
        button {
            padding: 12px 24px;
            margin: 10px 5px;
            font-size: 16px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            background: #667eea;
            color: white;
        }
        button:hover { background: #5568d3; }
        button:disabled { background: #ccc; cursor: not-allowed; }
        pre {
            background: #f8f9fa;
            padding: 10px;
            border-radius: 4px;
            overflow-x: auto;
            font-size: 12px;
        }
        .test-section {
            margin: 30px 0;
            padding: 20px;
            background: white;
            border-radius: 8px;
            border: 1px solid #ddd;
        }
        h2 { color: #333; margin-top: 0; }
    </style>
</head>
<body>
    <h1>🎵 Audio & Soundfont Loading Test</h1>

    <div class="test-section">
        <h2>1. Tone.js Audio Context Test</h2>
        <div id="toneStatus" class="status loading">⏳ Checking Tone.js...</div>
        <button id="unlockBtn" onclick="testAudioUnlock()">Unlock Audio Context</button>
        <div id="toneDetails"></div>
    </div>

    <div class="test-section">
        <h2>2. Soundfont Loading Test</h2>
        <div id="soundfontStatus" class="status loading">⏳ Checking soundfonts...</div>
        <div id="soundfontDetails"></div>
    </div>

    <div class="test-section">
        <h2>3. Audio Playback Test</h2>
        <button id="testPianoBtn" onclick="testPiano()" disabled>Test Piano (C4)</button>
        <button id="testChoirBtn" onclick="testChoir()" disabled>Test Choir (C4)</button>
        <button id="testFallbackBtn" onclick="testFallback()">Test Fallback Synth</button>
        <div id="playbackStatus"></div>
    </div>

    <script>
        let pianoSampler = null;
        let choirSampler = null;

        // Test 1: Tone.js
        function updateToneStatus() {
            const statusEl = document.getElementById('toneStatus');
            const detailsEl = document.getElementById('toneDetails');

            if (typeof Tone === 'undefined') {
                statusEl.className = 'status error';
                statusEl.innerHTML = '❌ Tone.js not loaded';
                detailsEl.innerHTML = '<div class="info">Tone.js library failed to load from CDN</div>';
                return false;
            }

            statusEl.className = 'status success';
            statusEl.innerHTML = '✅ Tone.js loaded';
            detailsEl.innerHTML = `
                <div class="info">
                    <strong>Tone.js Info:</strong><br>
                    Version: ${Tone.version || 'Unknown'}<br>
                    Context State: <strong>${Tone.context.state}</strong><br>
                    Sample Rate: ${Tone.context.sampleRate} Hz<br>
                    Base Latency: ${(Tone.context.baseLatency * 1000).toFixed(2)} ms<br>
                    ${Tone.context.state !== 'running' ? '<br><strong style="color: #dc3545;">⚠️ Audio context needs to be unlocked (click "Unlock Audio Context" button)</strong>' : ''}
                </div>
            `;
            return true;
        }

        async function testAudioUnlock() {
            const btn = document.getElementById('unlockBtn');
            btn.disabled = true;
            btn.textContent = 'Unlocking...';

            try {
                await Tone.start();
                await Tone.context.resume();

                // Wait for it to actually start
                let attempts = 0;
                while (Tone.context.state !== 'running' && attempts < 10) {
                    await new Promise(resolve => setTimeout(resolve, 100));
                    attempts++;
                }

                updateToneStatus();
                btn.textContent = Tone.context.state === 'running' ? '✅ Unlocked!' : 'Try Again';
                btn.disabled = Tone.context.state === 'running';

                if (Tone.context.state === 'running') {
                    checkSoundfontAvailability();
                }
            } catch (error) {
                console.error('Failed to unlock:', error);
                btn.textContent = 'Failed - Try Again';
                btn.disabled = false;
            }
        }

        // Test 2: Soundfonts
        function checkSoundfontAvailability() {
            const statusEl = document.getElementById('soundfontStatus');
            const detailsEl = document.getElementById('soundfontDetails');

            if (typeof MIDI === 'undefined') {
                statusEl.className = 'status error';
                statusEl.innerHTML = '❌ MIDI object not defined';
                detailsEl.innerHTML = `
                    <div class="info">
                        <strong>Problem:</strong> Soundfont scripts failed to load<br>
                        <strong>Files expected:</strong><br>
                        • /music_player/soundfonts/acoustic_grand_piano-ogg.js<br>
                        • /music_player/soundfonts/choir_aahs-ogg.js<br>
                        <br>
                        <strong>Possible causes:</strong><br>
                        • Incorrect file paths<br>
                        • Server not serving files correctly<br>
                        • Network/CORS issues<br>
                        <br>
                        Check browser console for 404 errors.
                    </div>
                `;
                return false;
            }

            if (!MIDI.Soundfont) {
                statusEl.className = 'status error';
                statusEl.innerHTML = '❌ MIDI.Soundfont not defined';
                detailsEl.innerHTML = '<div class="info">Soundfont data structure missing</div>';
                return false;
            }

            const available = Object.keys(MIDI.Soundfont);
            const pianoAvailable = available.includes('acoustic_grand_piano');
            const choirAvailable = available.includes('choir_aahs');

            if (available.length === 0) {
                statusEl.className = 'status error';
                statusEl.innerHTML = '❌ No soundfonts loaded';
                detailsEl.innerHTML = '<div class="info">MIDI.Soundfont exists but contains no data</div>';
                return false;
            }

            statusEl.className = 'status success';
            statusEl.innerHTML = `✅ ${available.length} soundfont(s) loaded`;

            let details = '<div class="info"><strong>Available Soundfonts:</strong><br>';
            available.forEach(name => {
                const sampleCount = Object.keys(MIDI.Soundfont[name]).length;
                details += `• <strong>${name}</strong>: ${sampleCount} samples<br>`;
            });
            details += '</div>';
            detailsEl.innerHTML = details;

            // Enable test buttons
            document.getElementById('testPianoBtn').disabled = !pianoAvailable;
            document.getElementById('testChoirBtn').disabled = !choirAvailable;

            return true;
        }

        // Test 3: Audio Playback
        async function loadSampler(soundfontKey, buttonId) {
            const btn = document.getElementById(buttonId);
            const statusEl = document.getElementById('playbackStatus');

            btn.disabled = true;
            btn.textContent = 'Loading...';
            statusEl.innerHTML = '<div class="status loading">⏳ Loading sampler...</div>';

            try {
                const soundfontData = MIDI.Soundfont[soundfontKey];
                const sampler = new Tone.Sampler({
                    urls: soundfontData,
                    attack: 0.01,
                    release: 1.5
                }).toDestination();

                await sampler.loaded;

                statusEl.innerHTML = '<div class="status success">✅ Sampler loaded successfully!</div>';
                btn.textContent = `Play ${soundfontKey}`;
                btn.disabled = false;

                return sampler;
            } catch (error) {
                statusEl.innerHTML = `<div class="status error">❌ Failed to load sampler: ${error.message}</div>`;
                btn.textContent = 'Failed - Retry';
                btn.disabled = false;
                throw error;
            }
        }

        async function testPiano() {
            if (!pianoSampler) {
                pianoSampler = await loadSampler('acoustic_grand_piano', 'testPianoBtn');
            }
            pianoSampler.triggerAttackRelease('C4', '2n');
            document.getElementById('playbackStatus').innerHTML = '<div class="status success">🎹 Playing Piano C4...</div>';
        }

        async function testChoir() {
            if (!choirSampler) {
                choirSampler = await loadSampler('choir_aahs', 'testChoirBtn');
            }
            choirSampler.triggerAttackRelease('C4', '2n');
            document.getElementById('playbackStatus').innerHTML = '<div class="status success">👥 Playing Choir C4...</div>';
        }

        function testFallback() {
            const synth = new Tone.Synth({
                oscillator: { type: 'triangle' },
                envelope: { attack: 0.005, decay: 0.1, sustain: 0.3, release: 1 }
            }).toDestination();

            synth.triggerAttackRelease('C4', '2n');
            document.getElementById('playbackStatus').innerHTML = '<div class="status success">🎛️ Playing Fallback Synth C4...</div>';

            setTimeout(() => synth.dispose(), 3000);
        }

        // Run tests on load
        window.addEventListener('load', () => {
            updateToneStatus();
            checkSoundfontAvailability();
        });
    </script>
</body>
</html>
