<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verovio Loading Test</title>
    <script src="https://www.verovio.org/javascript/latest/verovio-toolkit-wasm.js"></script>
    <script defer src="https://cdn.vercel.app/_vercel/insights/script.js"></script>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
            background: #f5f5f5;
        }
        .status {
            padding: 20px;
            margin: 20px 0;
            border-radius: 8px;
            font-size: 16px;
        }
        .loading {
            background: #fff3cd;
            border: 2px solid #ffc107;
        }
        .success {
            background: #d4edda;
            border: 2px solid #28a745;
        }
        .error {
            background: #f8d7da;
            border: 2px solid #dc3545;
        }
        .info {
            background: #d1ecf1;
            border: 2px solid #17a2b8;
            margin-top: 20px;
            font-size: 14px;
        }
        pre {
            background: #f8f9fa;
            padding: 10px;
            border-radius: 4px;
            overflow-x: auto;
        }
    </style>
</head>
<body>
    <h1>🎵 Verovio Loading Test</h1>
    <div id="status" class="status loading">⏳ Testing Verovio loading...</div>
    <div id="details"></div>

    <script>
        const statusEl = document.getElementById('status');
        const detailsEl = document.getElementById('details');

        async function testVerovio() {
            const startTime = Date.now();

            // Test 1: Check if verovio object exists
            let attempts = 0;
            while (typeof verovio === 'undefined' && attempts < 50) {
                await new Promise(resolve => setTimeout(resolve, 100));
                attempts++;
            }

            const scriptLoadTime = Date.now() - startTime;

            if (typeof verovio === 'undefined') {
                statusEl.className = 'status error';
                statusEl.innerHTML = '❌ FAILED: Verovio script never loaded';
                detailsEl.innerHTML = `
                    <div class="info">
                        <strong>Debug Info:</strong><br>
                        Time waited: ${scriptLoadTime}ms<br>
                        Attempts: ${attempts}<br>
                        typeof verovio: ${typeof verovio}<br>
                        <br>
                        <strong>Possible Issues:</strong><br>
                        • Network blocked verovio.org<br>
                        • Script blocked by ad-blocker<br>
                        • CORS or security policy issue<br>
                        • CDN is down<br>
                        <br>
                        Check browser console for errors.
                    </div>
                `;
                return false;
            }

            statusEl.innerHTML = '⏳ Script loaded, waiting for WASM runtime...';

            // Test 2: Try to create a toolkit (WASM must be ready)
            const wasmStartTime = Date.now();
            let wasmReady = false;

            const testInitialized = () => {
                try {
                    const testKit = new verovio.toolkit();
                    return true;
                } catch (e) {
                    return false;
                }
            };

            // Wait up to 30 seconds for WASM
            attempts = 0;
            while (!wasmReady && attempts < 150) {
                wasmReady = testInitialized();
                if (!wasmReady) {
                    await new Promise(resolve => setTimeout(resolve, 200));
                    attempts++;
                }
            }

            const wasmLoadTime = Date.now() - wasmStartTime;
            const totalTime = Date.now() - startTime;

            if (!wasmReady) {
                statusEl.className = 'status error';
                statusEl.innerHTML = '❌ FAILED: WASM runtime never initialized';
                detailsEl.innerHTML = `
                    <div class="info">
                        <strong>Debug Info:</strong><br>
                        Script load time: ${scriptLoadTime}ms<br>
                        WASM wait time: ${wasmLoadTime}ms<br>
                        Total time: ${totalTime}ms<br>
                        Attempts: ${attempts}<br>
                        verovio object exists: ${typeof verovio !== 'undefined'}<br>
                        verovio.module exists: ${typeof verovio !== 'undefined' && typeof verovio.module !== 'undefined'}<br>
                        <br>
                        <strong>Possible Issues:</strong><br>
                        • Browser doesn't support WebAssembly<br>
                        • WASM blocked by security policy<br>
                        • Memory limit exceeded<br>
                        • Incompatible browser version<br>
                        <br>
                        Check browser console for errors.
                    </div>
                `;
                return false;
            }

            // Success!
            statusEl.className = 'status success';
            statusEl.innerHTML = '✅ SUCCESS: Verovio loaded and ready!';

            // Get version info if available
            const tk = new verovio.toolkit();
            let versionInfo = 'Unknown';
            try {
                versionInfo = tk.getVersion();
            } catch (e) {
                console.warn('Could not get version:', e);
            }

            detailsEl.innerHTML = `
                <div class="info">
                    <strong>Performance:</strong><br>
                    Script load time: ${scriptLoadTime}ms<br>
                    WASM initialization time: ${wasmLoadTime}ms<br>
                    Total load time: ${totalTime}ms<br>
                    <br>
                    <strong>Verovio Info:</strong><br>
                    Version: ${versionInfo}<br>
                    <br>
                    <strong>Browser Info:</strong><br>
                    User Agent: ${navigator.userAgent}<br>
                    WebAssembly supported: ${typeof WebAssembly !== 'undefined'}<br>
                </div>
            `;

            return true;
        }

        // Run test on load
        testVerovio().then(success => {
            console.log('Verovio test completed:', success ? 'SUCCESS' : 'FAILED');
        });
    </script>
</body>
</html>
