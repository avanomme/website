<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Use Case Mapper</title>
    <style>
        /* Clean Dark Theme */
        :root {
            --background-primary: #12101a;
            --background-primary-alt: rgba(22, 18, 32, 0.72);
            --background-secondary: rgba(30, 25, 45, 0.85);
            --purple: #9f7aea;
            --purple-dim: hsla(270, 40%, 60%, 0.3);
            --purple-bright: hsla(270, 40%, 60%, 0.45);
            --text-normal: #f0eaff;
            --text-muted: rgba(255, 255, 255, 0.6);
            --text-faint: rgba(255, 255, 255, 0.5);
            --layer-4: rgba(255, 255, 255, 0.08);
            color-scheme: dark;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Fira Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: var(--background-primary);
            color: var(--text-normal);
            overflow: hidden;
        }

        #canvas-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            display: flex;
        }

        #sidebar {
            width: 300px;
            height: 100vh;
            background: var(--background-primary-alt);
            border-right: 1px solid var(--purple-dim);
            display: flex;
            flex-direction: column;
            z-index: 5;
        }

        #sidebar-header {
            padding: 20px;
            border-bottom: 1px solid var(--purple-dim);
        }

        #sidebar-header h3 {
            margin: 0 0 10px 0;
            color: var(--purple);
            font-size: 1.2rem;
        }

        #sidebar-content {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
        }

        .sidebar-item {
            background: var(--background-secondary);
            border: 1px solid var(--purple-dim);
            border-radius: 8px;
            margin-bottom: 8px;
            overflow: hidden;
        }

        .sidebar-item-header {
            padding: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .sidebar-item-header:hover {
            background: var(--purple-dim);
        }

        .sidebar-item-title {
            flex: 1;
            font-weight: 600;
            color: var(--text-normal);
            font-size: 0.9rem;
        }

        .sidebar-item-count {
            font-size: 0.75rem;
            color: var(--text-muted);
            background: var(--layer-4);
            padding: 2px 8px;
            border-radius: 10px;
        }

        .sidebar-item-btn {
            padding: 4px 8px;
            font-size: 0.75rem;
            background: var(--purple);
            border: 1px solid var(--purple);
            border-radius: 4px;
            color: var(--background-primary);
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s;
        }

        .sidebar-item-btn:hover {
            background: var(--purple-bright);
        }

        .sidebar-item-btn.secondary {
            background: transparent;
            color: var(--purple);
        }

        .expand-icon {
            font-size: 0.7rem;
            transition: transform 0.2s;
            display: inline-block;
        }

        .expand-icon.expanded {
            transform: rotate(90deg);
        }

        .sidebar-features {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s ease-out;
            background: var(--background-primary);
        }

        .sidebar-features.expanded {
            max-height: 500px;
        }

        .sidebar-feature-item {
            padding: 8px 12px;
            border-top: 1px solid var(--purple-dim);
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.85rem;
        }

        .sidebar-feature-item:hover {
            background: var(--purple-dim);
        }

        .sidebar-feature-info {
            color: var(--text-muted);
            font-size: 0.75rem;
            margin-top: 4px;
        }

        #canvas {
            cursor: default;
            width: 100%;
            height: 100%;
        }

        .controls {
            position: absolute;
            top: 20px;
            right: 20px;
            display: flex;
            gap: 10px;
            z-index: 10;
        }

        button {
            padding: 8px 16px;
            background: #89b4fa;
            border: none;
            border-radius: 6px;
            color: #1e1e2e;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover {
            background: #74c7ec;
        }

        .zoom-btn {
            width: 40px;
            height: 40px;
            font-size: 1.2rem;
            padding: 0;
        }

        button.secondary {
            background: #313244;
            color: #cdd6f4;
        }

        button.secondary:hover {
            background: #45475a;
        }

        #context-menu {
            position: absolute;
            display: none;
            background: var(--background-secondary);
            border: 1px solid var(--purple-dim);
            border-radius: 8px;
            padding: 6px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
            z-index: 100;
            min-width: 150px;
        }

        .context-menu-item {
            padding: 10px 14px;
            cursor: pointer;
            border-radius: 4px;
            transition: background 0.2s;
            color: var(--text-normal);
            font-size: 0.9rem;
        }

        .context-menu-item:hover {
            background: var(--purple-dim);
        }

        .context-menu-item.danger:hover {
            background: rgba(243, 139, 168, 0.2);
            color: #f38ba8;
        }

        #modal {
            position: absolute;
            display: none;
            background: #181825;
            border: 2px solid #89b4fa;
            border-radius: 8px;
            padding: 20px;
            min-width: 300px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
            z-index: 100;
        }

        #modal h3 {
            margin-bottom: 15px;
            color: #89b4fa;
        }

        #modal input, #modal textarea {
            width: 100%;
            padding: 8px 12px;
            background: #313244;
            border: 1px solid #45475a;
            border-radius: 6px;
            color: #cdd6f4;
            font-size: 0.9rem;
            margin-bottom: 10px;
            font-family: inherit;
        }

        #modal textarea {
            resize: vertical;
            min-height: 80px;
        }

        #modal input:focus, #modal textarea:focus {
            outline: none;
            border-color: #89b4fa;
        }

        #modal .button-group {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        #modal .button-group button {
            flex: 1;
        }

        .color-picker-grid {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 8px;
            margin: 10px 0;
        }

        .color-option {
            width: 40px;
            height: 40px;
            border-radius: 6px;
            cursor: pointer;
            border: 3px solid transparent;
            transition: all 0.2s;
        }

        .color-option:hover {
            transform: scale(1.1);
        }

        .color-option.selected {
            border-color: #cdd6f4;
        }

        .shape-picker {
            display: flex;
            gap: 10px;
            margin: 10px 0;
        }

        .shape-option {
            width: 60px;
            height: 60px;
            border: 2px solid #45475a;
            border-radius: 6px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        .shape-option:hover {
            border-color: #89b4fa;
        }

        .shape-option.selected {
            border-color: #cdd6f4;
            background: #313244;
        }

        .modal-section {
            margin: 15px 0;
        }

        .modal-section label {
            display: block;
            margin-bottom: 8px;
            color: #f5c2e7;
            font-weight: 600;
        }

        #bulk-import {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: #181825;
            border: 2px solid #a6e3a1;
            border-radius: 12px;
            padding: 30px;
            width: 600px;
            max-height: 80vh;
            overflow-y: auto;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
            z-index: 200;
            display: none;
        }

        #bulk-import h2 {
            margin-bottom: 20px;
            color: #a6e3a1;
        }

        #bulk-import textarea {
            width: 100%;
            min-height: 300px;
            padding: 15px;
            background: #313244;
            border: 1px solid #45475a;
            border-radius: 6px;
            color: #cdd6f4;
            font-family: 'Monaco', 'Courier New', monospace;
            font-size: 0.9rem;
            resize: vertical;
        }

        .info {
            position: absolute;
            bottom: 20px;
            left: 320px;
            background: rgba(24, 24, 37, 0.95);
            padding: 12px 16px;
            border-radius: 6px;
            font-size: 0.85rem;
            color: #a6adc8;
            max-width: 300px;
        }
    </style>
</head>
<body>
    <div id="canvas-container">
        <div id="sidebar">
            <div id="sidebar-header">
                <h3>Use Cases</h3>
                <button onclick="app.createAllUseCases()" style="width: 100%; padding: 8px; font-size: 0.85rem; margin-bottom: 8px;">Create All</button>
                <button onclick="app.showBulkImport()" style="width: 100%; padding: 8px; font-size: 0.85rem; margin-bottom: 8px;">+ Bulk Import</button>
                <button onclick="app.addSingleUseCase()" style="width: 100%; padding: 8px; font-size: 0.85rem;">+ Add Use Case</button>
            </div>
            <div id="sidebar-content">
                <!-- Use case list will be rendered here -->
            </div>
        </div>
        <div style="flex: 1; position: relative;">
            <canvas id="canvas"></canvas>
            <div class="controls">
                <button onclick="app.manualSave()" id="save-btn">💾 Save</button>
                <span id="save-status" style="padding: 8px 12px; background: rgba(0,0,0,0.3); border-radius: 6px; font-size: 0.85rem; color: #a6adc8;"></span>
                <button class="zoom-btn" onclick="app.zoomIn()">+</button>
                <button class="zoom-btn" onclick="app.zoomOut()">−</button>
                <button class="secondary" onclick="app.resetView()">Reset</button>
            </div>
            <div class="info">
                <strong>Controls:</strong><br>
                • Drag use cases to move them<br>
                • Double-click use case to add feature<br>
                • Right-click for menu<br>
                • Drag canvas to pan, scroll to zoom
            </div>
        </div>
    </div>

    <div id="context-menu">
        <div class="context-menu-item" onclick="app.contextMenuEdit()">Edit</div>
        <div class="context-menu-item" onclick="app.contextMenuAddFeature()" id="context-add-feature">Add Feature</div>
        <div class="context-menu-item danger" onclick="app.contextMenuDelete()">Delete</div>
    </div>

    <div id="bulk-import">
        <h2>Bulk Import Use Cases</h2>
        <p style="margin-bottom: 15px; color: #a6adc8;">Enter one use case per line. They will be added to your library.</p>
        <textarea id="bulk-import-text" placeholder="Enter use case names (one per line)..."></textarea>
        <div style="margin-top: 20px; display: flex; gap: 10px;">
            <button onclick="app.doBulkImport()" style="flex: 1;">Import</button>
            <button class="secondary" onclick="app.hideBulkImport()" style="flex: 1;">Cancel</button>
        </div>
    </div>

    <div id="modal">
        <h3 id="modal-title">Edit</h3>
        <input type="text" id="modal-name" placeholder="Name">
        <textarea id="modal-info" placeholder="Description/Info"></textarea>
        <input type="text" id="modal-group" placeholder="Group name (optional)">

        <div class="modal-section" id="color-section">
            <label>Color</label>
            <div class="color-picker-grid" id="color-picker"></div>
        </div>

        <div class="modal-section" id="shape-section">
            <label>Shape</label>
            <div class="shape-picker" id="shape-picker"></div>
        </div>

        <div class="button-group">
            <button onclick="app.saveModal()">Save</button>
            <button class="secondary" onclick="app.deleteFromModal()">Delete</button>
            <button class="secondary" onclick="app.closeModal()">Cancel</button>
        </div>
    </div>

    <script>
        class UseCaseMapper {
            constructor() {
                this.canvas = document.getElementById('canvas');
                this.ctx = this.canvas.getContext('2d');

                this.useCases = [];
                this.features = [];
                this.connections = [];

                this.camera = { x: 0, y: 0, scale: 1 };
                this.isDraggingCanvas = false;
                this.isDraggingNode = false;
                this.draggedNode = null;
                this.dragStart = { x: 0, y: 0 };
                this.lastClickTime = 0;
                this.lastClickNode = null;

                this.modal = document.getElementById('modal');
                this.modalMode = null; // 'usecase', 'feature'
                this.editingId = null;
                this.selectedColor = '#89b4fa';
                this.selectedShape = 'square';

                this.contextMenu = document.getElementById('context-menu');
                this.contextMenuNode = null;
                this.contextMenuType = null;

                this.colors = [
                    '#89b4fa', '#f5c2e7', '#a6e3a1', '#fab387',
                    '#f38ba8', '#cba6f7', '#74c7ec', '#f9e2af',
                    '#eba0ac', '#94e2d5', '#b4befe', '#f5e0dc'
                ];

                this.shapes = ['square', 'circle', 'diamond', 'hexagon'];

                this.lastSaveTime = null;
                this.autoSaveInterval = null;

                this.init();
            }

            init() {
                this.resizeCanvas();
                window.addEventListener('resize', () => this.resizeCanvas());

                this.canvas.addEventListener('mousedown', (e) => this.onMouseDown(e));
                this.canvas.addEventListener('mousemove', (e) => this.onMouseMove(e));
                this.canvas.addEventListener('mouseup', (e) => this.onMouseUp(e));
                this.canvas.addEventListener('wheel', (e) => this.onWheel(e));
                this.canvas.addEventListener('contextmenu', (e) => this.onContextMenu(e));

                // Close context menu when clicking elsewhere
                document.addEventListener('click', () => this.hideContextMenu());

                this.initializeColorPicker();
                this.initializeShapePicker();

                // Load saved data from server
                this.loadFromServer();

                // Setup auto-save every 10 seconds
                this.autoSaveInterval = setInterval(() => {
                    this.saveToServer();
                }, 10000);
            }

            initializeColorPicker() {
                const picker = document.getElementById('color-picker');
                picker.innerHTML = this.colors.map(color =>
                    `<div class="color-option" style="background: ${color}" onclick="app.selectColor('${color}')"></div>`
                ).join('');
            }

            initializeShapePicker() {
                const picker = document.getElementById('shape-picker');
                const shapeIcons = {
                    square: '⬛',
                    circle: '⚫',
                    diamond: '🔷',
                    hexagon: '⬢'
                };
                picker.innerHTML = this.shapes.map(shape =>
                    `<div class="shape-option" onclick="app.selectShape('${shape}')\">${shapeIcons[shape]}</div>`
                ).join('');
            }

            selectColor(color) {
                this.selectedColor = color;
                document.querySelectorAll('.color-option').forEach(el => {
                    el.classList.toggle('selected', el.style.background === color);
                });
            }

            selectShape(shape) {
                this.selectedShape = shape;
                document.querySelectorAll('.shape-option').forEach((el, i) => {
                    el.classList.toggle('selected', this.shapes[i] === shape);
                });
            }

            resizeCanvas() {
                const sidebar = document.getElementById('sidebar');
                this.canvas.width = window.innerWidth - sidebar.offsetWidth;
                this.canvas.height = window.innerHeight;
                this.render();
            }

            screenToWorld(x, y) {
                return {
                    x: (x - this.camera.x) / this.camera.scale,
                    y: (y - this.camera.y) / this.camera.scale
                };
            }

            worldToScreen(x, y) {
                return {
                    x: x * this.camera.scale + this.camera.x,
                    y: y * this.camera.scale + this.camera.y
                };
            }

            getNodeAt(worldX, worldY) {
                // Check use cases FIRST (matches original code behavior)
                for (const uc of this.useCases) {
                    // Only check placed use cases
                    if (uc.placed !== false && uc.x !== null && uc.y !== null) {
                        if (this.hitTestShape(uc, worldX, worldY)) {
                            return { type: 'usecase', node: uc };
                        }
                    }
                }

                // Then check features
                for (const feature of this.features) {
                    if (this.hitTestShape(feature, worldX, worldY)) {
                        return { type: 'feature', node: feature };
                    }
                }

                return null;
            }

            hitTestShape(node, x, y) {
                const shape = node.shape || 'square';
                const size = node.width || node.radius * 2;

                switch(shape) {
                    case 'circle':
                        const radius = node.radius || size / 2;
                        const dx = x - node.x;
                        const dy = y - node.y;
                        return dx * dx + dy * dy <= radius * radius;

                    case 'square':
                    case 'rounded':
                        const halfW = (node.width || size) / 2;
                        const halfH = (node.height || size) / 2;
                        const distX = Math.abs(x - node.x);
                        const distY = Math.abs(y - node.y);
                        const hit = distX <= halfW && distY <= halfH;

                        // Debug logging
                        if (node.name) {
                            console.log(`Testing ${node.name}: click(${x.toFixed(1)}, ${y.toFixed(1)}) vs center(${node.x.toFixed(1)}, ${node.y.toFixed(1)}) size(${node.width}x${node.height}) distX=${distX.toFixed(1)} <= ${halfW.toFixed(1)}? distY=${distY.toFixed(1)} <= ${halfH.toFixed(1)}? => ${hit}`);
                        }

                        return hit;

                    case 'diamond':
                    case 'hexagon':
                        // Simple bounding box for now
                        const half = size / 2;
                        return Math.abs(x - node.x) <= half && Math.abs(y - node.y) <= half;

                    default:
                        return false;
                }
            }

            onMouseDown(e) {
                const rect = this.canvas.getBoundingClientRect();
                const screenX = e.clientX - rect.left;
                const screenY = e.clientY - rect.top;
                const world = this.screenToWorld(screenX, screenY);

                const hit = this.getNodeAt(world.x, world.y);

                if (hit) {
                    this.isDraggingNode = true;
                    this.draggedNode = hit.node;
                    this.dragStart = { x: world.x - hit.node.x, y: world.y - hit.node.y };
                } else {
                    this.isDraggingCanvas = true;
                    this.dragStart = { x: e.clientX - this.camera.x, y: e.clientY - this.camera.y };
                }
            }

            onMouseMove(e) {
                const rect = this.canvas.getBoundingClientRect();
                const screenX = e.clientX - rect.left;
                const screenY = e.clientY - rect.top;
                const world = this.screenToWorld(screenX, screenY);

                if (this.isDraggingNode && this.draggedNode) {
                    this.draggedNode.x = world.x - this.dragStart.x;
                    this.draggedNode.y = world.y - this.dragStart.y;
                    this.render();
                } else if (this.isDraggingCanvas) {
                    this.camera.x = e.clientX - this.dragStart.x;
                    this.camera.y = e.clientY - this.dragStart.y;
                    this.render();
                }

                const hit = this.getNodeAt(world.x, world.y);
                this.canvas.style.cursor = hit ? 'pointer' : 'default';
            }

            onMouseUp(e) {
                const rect = this.canvas.getBoundingClientRect();
                const screenX = e.clientX - rect.left;
                const screenY = e.clientY - rect.top;
                const world = this.screenToWorld(screenX, screenY);

                const hit = this.getNodeAt(world.x, world.y);

                // Simple double-click detection (EXACTLY like original code)
                const now = Date.now();
                if (hit && hit.node === this.lastClickNode && now - this.lastClickTime < 300) {
                    // Double-click detected
                    if (hit.type === 'usecase') {
                        this.addFeatureToUseCase(hit.node);
                    } else if (hit.type === 'feature') {
                        this.editFeature(hit.node);
                    }
                    this.lastClickTime = 0;
                    this.lastClickNode = null;
                } else {
                    // Single click - open edit modal
                    if (hit && !this.isDraggingNode) {
                        if (hit.type === 'usecase') {
                            this.editUseCase(hit.node);
                        } else if (hit.type === 'feature') {
                            this.editFeature(hit.node);
                        }
                    }
                    this.lastClickTime = now;
                    this.lastClickNode = hit ? hit.node : null;
                }

                // Auto-save position changes after dragging
                if (this.isDraggingNode) {
                    this.saveToServer();
                }

                this.isDraggingCanvas = false;
                this.isDraggingNode = false;
                this.draggedNode = null;
            }

            onWheel(e) {
                e.preventDefault();
                const rect = this.canvas.getBoundingClientRect();
                const mouseX = e.clientX - rect.left;
                const mouseY = e.clientY - rect.top;

                const delta = -e.deltaY * 0.001;
                const newScale = Math.max(0.3, Math.min(3, this.camera.scale + delta));

                this.camera.x = mouseX - (mouseX - this.camera.x) * (newScale / this.camera.scale);
                this.camera.y = mouseY - (mouseY - this.camera.y) * (newScale / this.camera.scale);
                this.camera.scale = newScale;

                this.render();
            }

            onContextMenu(e) {
                e.preventDefault();
                const rect = this.canvas.getBoundingClientRect();
                const screenX = e.clientX - rect.left;
                const screenY = e.clientY - rect.top;
                const world = this.screenToWorld(screenX, screenY);

                console.log('Right-click at world coords:', world);

                const hit = this.getNodeAt(world.x, world.y);

                console.log('Hit result:', hit);
                if (hit) {
                    console.log('Hit node:', hit.node.name, 'at', hit.node.x, hit.node.y, 'size:', hit.node.width, 'x', hit.node.height);
                }

                if (hit) {
                    this.contextMenuNode = hit.node;
                    this.contextMenuType = hit.type;
                    this.contextMenu.style.display = 'block';
                    this.contextMenu.style.left = e.clientX + 'px';
                    this.contextMenu.style.top = e.clientY + 'px';

                    // Show/hide "Add Feature" based on type
                    const addFeatureBtn = document.getElementById('context-add-feature');
                    if (addFeatureBtn) {
                        addFeatureBtn.style.display = hit.type === 'usecase' ? 'block' : 'none';
                    }
                }
            }

            hideContextMenu() {
                this.contextMenu.style.display = 'none';
                this.contextMenuNode = null;
                this.contextMenuType = null;
            }

            contextMenuEdit() {
                if (!this.contextMenuNode) return;

                if (this.contextMenuType === 'usecase') {
                    this.editUseCase(this.contextMenuNode);
                } else if (this.contextMenuType === 'feature') {
                    this.editFeature(this.contextMenuNode);
                }

                this.hideContextMenu();
            }

            contextMenuAddFeature() {
                if (!this.contextMenuNode || this.contextMenuType !== 'usecase') return;
                this.addFeatureToUseCase(this.contextMenuNode);
                this.hideContextMenu();
            }

            contextMenuDelete() {
                if (!this.contextMenuNode) return;

                if (this.contextMenuType === 'usecase') {
                    // For use cases: remove from canvas (mark as unplaced) instead of deleting
                    if (!confirm('Remove this use case from the canvas? (It will remain in the sidebar)')) {
                        this.hideContextMenu();
                        return;
                    }

                    const useCase = this.contextMenuNode;
                    useCase.placed = false;
                    useCase.x = null;
                    useCase.y = null;

                    // Remove associated features from canvas
                    const featuresToRemove = this.features.filter(f => f.useCaseId === useCase.id);
                    featuresToRemove.forEach(f => {
                        this.connections = this.connections.filter(c => c.to !== f.id && c.from !== f.id);
                    });
                    this.features = this.features.filter(f => f.useCaseId !== useCase.id);
                } else if (this.contextMenuType === 'feature') {
                    // For features: actually delete them
                    if (!confirm('Delete this feature?')) {
                        this.hideContextMenu();
                        return;
                    }
                    this.connections = this.connections.filter(c => c.to !== this.contextMenuNode.id && c.from !== this.contextMenuNode.id);
                    this.features = this.features.filter(f => f.id !== this.contextMenuNode.id);
                }

                this.hideContextMenu();
                this.saveToServer();
                this.renderSidebar();
                this.render();
            }

            addFeatureToUseCase(useCase) {
                const angle = Math.random() * Math.PI * 2;
                const distance = 120;

                const feature = {
                    id: Date.now(),
                    x: useCase.x + Math.cos(angle) * distance,
                    y: useCase.y + Math.sin(angle) * distance,
                    radius: 40,
                    name: 'New Feature',
                    info: '',
                    useCaseId: useCase.id,
                    color: '#a6e3a1',
                    shape: 'circle'
                };

                this.features.push(feature);
                this.connections.push({ from: useCase.id, to: feature.id });

                this.saveToServer();
                this.renderSidebar();
                this.render();

                setTimeout(() => this.editFeature(feature), 100);
            }

            editUseCase(useCase) {
                this.modalMode = 'usecase';
                this.editingId = useCase.id;
                this.selectedColor = useCase.color || '#89b4fa';
                this.selectedShape = useCase.shape || 'square';

                document.getElementById('modal-title').textContent = 'Edit Use Case';
                document.getElementById('modal-name').value = useCase.name;
                document.getElementById('modal-info').value = useCase.info;
                document.getElementById('modal-group').value = useCase.group || '';
                document.getElementById('color-section').style.display = 'block';
                document.getElementById('shape-section').style.display = 'block';
                document.getElementById('modal-group').style.display = 'block';

                this.selectColor(this.selectedColor);
                this.selectShape(this.selectedShape);

                this.showModal();
            }

            editFeature(feature) {
                this.modalMode = 'feature';
                this.editingId = feature.id;
                this.selectedColor = feature.color || '#a6e3a1';
                this.selectedShape = feature.shape || 'circle';

                document.getElementById('modal-title').textContent = 'Edit Feature';
                document.getElementById('modal-name').value = feature.name;
                document.getElementById('modal-info').value = feature.info;
                document.getElementById('modal-group').style.display = 'none';
                document.getElementById('color-section').style.display = 'block';
                document.getElementById('shape-section').style.display = 'block';

                this.selectColor(this.selectedColor);
                this.selectShape(this.selectedShape);

                this.showModal();
            }

            showModal() {
                this.modal.style.display = 'block';
                this.modal.style.left = '50%';
                this.modal.style.top = '50%';
                this.modal.style.transform = 'translate(-50%, -50%)';
                document.getElementById('modal-name').focus();
            }

            closeModal() {
                this.modal.style.display = 'none';
                this.modalMode = null;
                this.editingId = null;
            }

            saveModal() {
                const name = document.getElementById('modal-name').value.trim();
                const info = document.getElementById('modal-info').value.trim();
                const group = document.getElementById('modal-group').value.trim();

                if (!name) {
                    alert('Name is required');
                    return;
                }

                if (this.modalMode === 'usecase') {
                    const uc = this.useCases.find(u => u.id === this.editingId);
                    if (uc) {
                        uc.name = name;
                        uc.info = info;
                        uc.group = group;
                        uc.color = this.selectedColor;
                        uc.shape = this.selectedShape;
                    }
                } else if (this.modalMode === 'feature') {
                    const feature = this.features.find(f => f.id === this.editingId);
                    if (feature) {
                        feature.name = name;
                        feature.info = info;
                        feature.color = this.selectedColor;
                        feature.shape = this.selectedShape;
                    }
                }

                this.closeModal();
                this.saveToServer();
                this.renderSidebar();
                this.render();
            }

            deleteFromModal() {
                if (!confirm('Delete this item?')) return;

                if (this.modalMode === 'usecase') {
                    const featuresToDelete = this.features.filter(f => f.useCaseId === this.editingId);
                    featuresToDelete.forEach(f => {
                        this.connections = this.connections.filter(c => c.to !== f.id && c.from !== f.id);
                    });
                    this.features = this.features.filter(f => f.useCaseId !== this.editingId);
                    this.useCases = this.useCases.filter(u => u.id !== this.editingId);
                } else if (this.modalMode === 'feature') {
                    this.connections = this.connections.filter(c => c.to !== this.editingId && c.from !== this.editingId);
                    this.features = this.features.filter(f => f.id !== this.editingId);
                }

                this.closeModal();
                this.saveToServer();
                this.renderSidebar();
                this.render();
            }

            // Sidebar functions
            createAllUseCases() {
                const unplaced = this.useCases.filter(uc => !uc.placed || uc.x === null || uc.y === null);

                if (unplaced.length === 0) {
                    alert('All use cases are already on the canvas!');
                    return;
                }

                // Place in a grid layout
                const cols = Math.ceil(Math.sqrt(unplaced.length));
                const spacing = 250;
                const centerWorld = this.screenToWorld(this.canvas.width / 2, this.canvas.height / 2);
                const startX = centerWorld.x - ((cols - 1) * spacing) / 2;
                const startY = centerWorld.y - ((Math.ceil(unplaced.length / cols) - 1) * spacing) / 2;

                unplaced.forEach((uc, index) => {
                    const col = index % cols;
                    const row = Math.floor(index / cols);
                    uc.x = startX + col * spacing;
                    uc.y = startY + row * spacing;
                    uc.placed = true;
                });

                this.saveToServer();
                this.renderSidebar();
                this.render();

                alert(`Placed ${unplaced.length} use cases on canvas!`);
            }

            showBulkImport() {
                document.getElementById('bulk-import').style.display = 'block';
                document.getElementById('bulk-import-text').focus();
            }

            hideBulkImport() {
                document.getElementById('bulk-import').style.display = 'none';
                document.getElementById('bulk-import-text').value = '';
            }

            doBulkImport() {
                const text = document.getElementById('bulk-import-text').value;
                const lines = text.split('\n').map(l => l.trim()).filter(l => l.length > 0);

                if (lines.length === 0) {
                    alert('Please enter at least one use case name.');
                    return;
                }

                lines.forEach(line => {
                    this.useCases.push({
                        id: Date.now() + Math.random(),
                        x: null,
                        y: null,
                        width: 200,
                        height: 120,
                        name: line,
                        info: 'Description...',
                        group: '',
                        color: '#89b4fa',
                        shape: 'square',
                        placed: false
                    });
                });

                this.saveToServer();
                this.renderSidebar();
                this.render();
                this.hideBulkImport();

                alert(`Successfully imported ${lines.length} use cases to library!`);
            }

            addSingleUseCase() {
                const name = prompt('Enter use case name:');
                if (!name || !name.trim()) return;

                this.useCases.push({
                    id: Date.now(),
                    x: null,
                    y: null,
                    width: 140,
                    height: 100,
                    name: name.trim(),
                    info: '',
                    group: '',
                    color: '#89b4fa',
                    shape: 'square',
                    placed: false
                });

                this.saveToServer();
                this.renderSidebar();
                this.render();
            }

            deleteUseCaseFromSidebar(useCaseId) {
                if (!confirm('Delete this use case and all its features?')) return;

                // Delete associated features
                const featuresToDelete = this.features.filter(f => f.useCaseId === useCaseId);
                featuresToDelete.forEach(f => {
                    this.connections = this.connections.filter(c => c.to !== f.id && c.from !== f.id);
                });
                this.features = this.features.filter(f => f.useCaseId !== useCaseId);

                // Delete use case
                this.useCases = this.useCases.filter(u => u.id !== useCaseId);

                this.saveToServer();
                this.renderSidebar();
                this.render();
            }

            placeUseCaseOnCanvas(useCaseId) {
                const uc = this.useCases.find(u => u.id === useCaseId);
                if (!uc) return;

                // Place at center of current view
                const centerWorld = this.screenToWorld(this.canvas.width / 2, this.canvas.height / 2);
                uc.x = centerWorld.x;
                uc.y = centerWorld.y;
                uc.placed = true;

                this.saveToServer();
                this.renderSidebar();
                this.render();
            }

            jumpToUseCase(useCaseId) {
                const uc = this.useCases.find(u => u.id === useCaseId);
                if (!uc || !uc.placed) return;

                // Center on use case
                const screenCenter = {
                    x: this.canvas.width / 2,
                    y: this.canvas.height / 2
                };

                this.camera.x = screenCenter.x - uc.x * this.camera.scale;
                this.camera.y = screenCenter.y - uc.y * this.camera.scale;

                this.render();
            }

            renderSidebar() {
                const sidebar = document.getElementById('sidebar-content');

                if (this.useCases.length === 0) {
                    sidebar.innerHTML = '<p style="text-align: center; color: var(--text-muted); padding: 20px;">No use cases yet. Use Bulk Import to add some!</p>';
                    return;
                }

                sidebar.innerHTML = this.useCases.map(uc => {
                    const features = this.features.filter(f => f.useCaseId === uc.id);
                    const featureCount = features.length;
                    const isPlaced = uc.placed !== false && uc.x !== null && uc.y !== null;

                    return `
                        <div class="sidebar-item" data-id="${uc.id}">
                            <div class="sidebar-item-header" onclick="app.toggleFeatures(${uc.id})">
                                <span class="expand-icon">▶</span>
                                <div class="sidebar-item-title">${uc.name}</div>
                                <span class="sidebar-item-count">${featureCount}</span>
                            </div>
                            <div style="padding: 8px 12px; display: flex; gap: 4px; border-top: 1px solid var(--purple-dim);">
                                ${isPlaced ? `
                                    <button class="sidebar-item-btn" onclick="app.jumpToUseCase(${uc.id}); event.stopPropagation();">Jump</button>
                                    <button class="sidebar-item-btn secondary" onclick="app.editUseCase(app.useCases.find(u => u.id === ${uc.id})); event.stopPropagation();">Edit</button>
                                    <button class="sidebar-item-btn secondary" onclick="app.deleteUseCaseFromSidebar(${uc.id}); event.stopPropagation();" style="background: rgba(243, 139, 168, 0.2); border-color: #f38ba8; color: #f38ba8;">Delete</button>
                                ` : `
                                    <button class="sidebar-item-btn" onclick="app.placeUseCaseOnCanvas(${uc.id}); event.stopPropagation();">Create</button>
                                    <button class="sidebar-item-btn secondary" onclick="app.editUseCase(app.useCases.find(u => u.id === ${uc.id})); event.stopPropagation();">Edit</button>
                                    <button class="sidebar-item-btn secondary" onclick="app.deleteUseCaseFromSidebar(${uc.id}); event.stopPropagation();" style="background: rgba(243, 139, 168, 0.2); border-color: #f38ba8; color: #f38ba8;">Delete</button>
                                `}
                            </div>
                            <div class="sidebar-features" data-usecase="${uc.id}">
                                ${features.map(f => `
                                    <div class="sidebar-feature-item" onclick="app.jumpToFeature(${f.id}); event.stopPropagation();">
                                        <div style="flex: 1;">
                                            <div><strong>${f.name}</strong></div>
                                            ${f.info ? `<div class="sidebar-feature-info">${f.info}</div>` : ''}
                                        </div>
                                    </div>
                                `).join('')}
                                ${features.length === 0 ? '<div style="padding: 12px; text-align: center; color: var(--text-muted); font-size: 0.8rem;">No features yet</div>' : ''}
                            </div>
                        </div>
                    `;
                }).join('');
            }

            toggleFeatures(useCaseId) {
                const item = document.querySelector(`.sidebar-features[data-usecase="${useCaseId}"]`);
                const icon = item.previousElementSibling.previousElementSibling.querySelector('.expand-icon');

                if (item.classList.contains('expanded')) {
                    item.classList.remove('expanded');
                    icon.classList.remove('expanded');
                } else {
                    item.classList.add('expanded');
                    icon.classList.add('expanded');
                }
            }

            jumpToFeature(featureId) {
                const feature = this.features.find(f => f.id === featureId);
                if (!feature) return;

                // Center on feature
                const screenCenter = {
                    x: this.canvas.width / 2,
                    y: this.canvas.height / 2
                };

                this.camera.x = screenCenter.x - feature.x * this.camera.scale;
                this.camera.y = screenCenter.y - feature.y * this.camera.scale;

                this.render();
            }

            // Save/Load functions - Server-based for shared editing
            async saveToServer() {
                const data = {
                    useCases: this.useCases,
                    features: this.features,
                    connections: this.connections,
                    lastSaved: new Date().toISOString()
                };

                try {
                    const response = await fetch('/api/se/projects/shared-project', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(data)
                    });

                    if (response.ok) {
                        this.lastSaveTime = new Date();
                        this.updateSaveStatus('Auto-saved');
                        return true;
                    } else {
                        console.error('Save failed:', await response.text());
                        this.updateSaveStatus('Save failed', true);
                        return false;
                    }
                } catch (error) {
                    console.error('Save error:', error);
                    this.updateSaveStatus('Save error', true);
                    return false;
                }
            }

            async loadFromServer() {
                try {
                    const response = await fetch('/api/se/projects/shared-project');

                    if (response.ok) {
                        const result = await response.json();

                        if (result.success && result.data) {
                            this.useCases = result.data.useCases || [];
                            this.features = result.data.features || [];
                            this.connections = result.data.connections || [];
                            this.lastSaveTime = result.data.lastSaved ? new Date(result.data.lastSaved) : null;

                            this.renderSidebar();
                            this.render();
                            this.updateSaveStatus('Loaded');
                        } else {
                            // No project exists yet, start fresh
                            this.renderSidebar();
                            this.render();
                            this.updateSaveStatus('Ready');
                        }
                    } else {
                        console.error('Load failed:', await response.text());
                        this.renderSidebar();
                        this.render();
                        this.updateSaveStatus('Load failed', true);
                    }
                } catch (error) {
                    console.error('Load error:', error);
                    this.renderSidebar();
                    this.render();
                    this.updateSaveStatus('Load error', true);
                }
            }

            async manualSave() {
                const success = await this.saveToServer();
                if (success) {
                    this.updateSaveStatus('Saved!');
                }
            }

            updateSaveStatus(message, isError = false) {
                const statusEl = document.getElementById('save-status');
                if (!statusEl) return;

                const now = new Date();
                const timeStr = now.toLocaleTimeString('en-US', {
                    hour: '2-digit',
                    minute: '2-digit',
                    second: '2-digit'
                });

                statusEl.textContent = `${message} at ${timeStr}`;
                statusEl.style.color = isError ? '#f38ba8' : '#a6e3a1';

                // Fade back to normal color after 2 seconds
                setTimeout(() => {
                    statusEl.style.color = '#a6adc8';
                }, 2000);
            }

            render() {
                this.ctx.save();
                this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);

                this.ctx.translate(this.camera.x, this.camera.y);
                this.ctx.scale(this.camera.scale, this.camera.scale);

                // Draw connections
                this.connections.forEach(conn => {
                    const from = this.useCases.find(u => u.id === conn.from);
                    const to = this.features.find(f => f.id === conn.to);

                    if (from && to) {
                        this.ctx.strokeStyle = '#45475a';
                        this.ctx.lineWidth = 2;
                        this.ctx.beginPath();
                        this.ctx.moveTo(from.x, from.y);
                        this.ctx.lineTo(to.x, to.y);
                        this.ctx.stroke();
                    }
                });

                // Draw use cases (only placed ones)
                this.useCases.forEach(uc => {
                    if (uc.placed !== false && uc.x !== null && uc.y !== null) {
                        this.drawShape(uc, uc.shape || 'square', uc.color || '#89b4fa', true);
                    }
                });

                // Draw features
                this.features.forEach(feature => {
                    this.drawShape(feature, feature.shape || 'circle', feature.color || '#a6e3a1', false);
                });

                this.ctx.restore();
            }

            drawShape(node, shape, color, isUseCase) {
                this.ctx.fillStyle = color;
                this.ctx.strokeStyle = '#45475a';
                this.ctx.lineWidth = 2;

                const size = isUseCase ? (node.width || 140) : (node.radius * 2 || 80);

                switch(shape) {
                    case 'circle':
                        const radius = isUseCase ? size / 2 : node.radius;
                        this.ctx.beginPath();
                        this.ctx.arc(node.x, node.y, radius, 0, Math.PI * 2);
                        this.ctx.fill();
                        this.ctx.stroke();
                        break;

                    case 'square':
                    case 'rounded':
                        const width = node.width || size;
                        const height = node.height || size;

                        // Group color bar for use cases
                        if (isUseCase && node.group) {
                            const hash = node.group.split('').reduce((acc, c) => acc + c.charCodeAt(0), 0);
                            const colors = ['#f5c2e7', '#fab387', '#a6e3a1', '#89dceb', '#cba6f7'];
                            this.ctx.fillStyle = colors[hash % colors.length];
                            this.ctx.fillRect(node.x - width / 2, node.y - height / 2, width, 8);
                            this.ctx.fillStyle = color;
                        }

                        if (shape === 'rounded') {
                            const cornerRadius = 10;
                            this.ctx.beginPath();
                            this.ctx.roundRect(
                                node.x - width / 2,
                                node.y - height / 2 + (isUseCase && node.group ? 8 : 0),
                                width,
                                height - (isUseCase && node.group ? 8 : 0),
                                cornerRadius
                            );
                            this.ctx.fill();
                            this.ctx.stroke();
                        } else {
                            this.ctx.fillRect(
                                node.x - width / 2,
                                node.y - height / 2 + (isUseCase && node.group ? 8 : 0),
                                width,
                                height - (isUseCase && node.group ? 8 : 0)
                            );
                            this.ctx.strokeRect(node.x - width / 2, node.y - height / 2, width, height);
                        }
                        break;

                    case 'diamond':
                        const half = size / 2;
                        this.ctx.beginPath();
                        this.ctx.moveTo(node.x, node.y - half);
                        this.ctx.lineTo(node.x + half, node.y);
                        this.ctx.lineTo(node.x, node.y + half);
                        this.ctx.lineTo(node.x - half, node.y);
                        this.ctx.closePath();
                        this.ctx.fill();
                        this.ctx.stroke();
                        break;

                    case 'hexagon':
                        const h = size / 2;
                        const angle = Math.PI / 3;
                        this.ctx.beginPath();
                        for (let i = 0; i < 6; i++) {
                            const x = node.x + h * Math.cos(i * angle);
                            const y = node.y + h * Math.sin(i * angle);
                            if (i === 0) this.ctx.moveTo(x, y);
                            else this.ctx.lineTo(x, y);
                        }
                        this.ctx.closePath();
                        this.ctx.fill();
                        this.ctx.stroke();
                        break;
                }

                // Draw text
                this.ctx.fillStyle = '#1e1e2e';
                this.ctx.font = isUseCase ? 'bold 14px sans-serif' : 'bold 12px sans-serif';
                this.ctx.textAlign = 'center';
                this.ctx.textBaseline = 'middle';

                const maxWidth = isUseCase ? (node.width - 20) : (node.radius * 1.6);
                const lines = this.wrapText(node.name, maxWidth);
                const lineHeight = isUseCase ? 16 : 14;
                const startY = node.y - ((lines.length - 1) * lineHeight) / 2;

                lines.forEach((line, i) => {
                    this.ctx.fillText(line, node.x, startY + i * lineHeight);
                });
            }

            wrapText(text, maxWidth) {
                const words = text.split(' ');
                const lines = [];
                let currentLine = words[0];

                for (let i = 1; i < words.length; i++) {
                    const testLine = currentLine + ' ' + words[i];
                    const metrics = this.ctx.measureText(testLine);
                    if (metrics.width > maxWidth) {
                        lines.push(currentLine);
                        currentLine = words[i];
                    } else {
                        currentLine = testLine;
                    }
                }
                lines.push(currentLine);
                return lines;
            }

            zoomIn() {
                this.camera.scale = Math.min(3, this.camera.scale + 0.2);
                this.render();
            }

            zoomOut() {
                this.camera.scale = Math.max(0.3, this.camera.scale - 0.2);
                this.render();
            }

            resetView() {
                this.camera = { x: 0, y: 0, scale: 1 };
                this.render();
            }
        }

        const app = new UseCaseMapper();
    </script>
</body>
</html>
